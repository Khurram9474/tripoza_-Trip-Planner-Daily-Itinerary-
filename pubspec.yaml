name: tripora
description: "Tripora — Smart Trip Planner. Plan. Explore. Remember."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Date formatting & duration/status calculations
  intl: ^0.19.0

  # Unique IDs for trips/activities
  uuid: ^4.4.0

  # Typography (Poppins)
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.2.0

  # Value equality for immutable Trip/Activity entities (needed for Riverpod
  # to correctly detect state changes and avoid unnecessary rebuilds)
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Hive code generation (generates TypeAdapters for Trip/Activity models)
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

  # Pinned to match SDK/analyzer compatibility (see Phase 5 build_runner fix)
  analyzer: ^6.4.1

  # Generates launcher icons from assets/icons/app_icon.png
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B3A6B"
  adaptive_icon_foreground: "assets/app_icon.png"